<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora sospechosamente funcional</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: #f9fafb;
    }

    .card {
      width: min(92vw, 420px);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      background: rgba(17, 24, 39, 0.9);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }

    p {
      color: #cbd5e1;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 110px 1fr;
      gap: 10px;
      align-items: center;
    }

    input,
    select,
    button {
      min-height: 44px;
      border-radius: 10px;
      border: 1px solid #475569;
      font: inherit;
    }

    input,
    select {
      padding: 0 12px;
      background: #0f172a;
      color: #f8fafc;
    }

    button {
      width: 100%;
      margin-top: 14px;
      border: 0;
      background: #2563eb;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #020617;
      border: 1px solid #334155;
    }

    .result strong {
      display: block;
      margin-top: 6px;
      font-size: 1.5rem;
      overflow-wrap: anywhere;
    }

    .error {
      color: #fca5a5;
    }

    @media (max-width: 520px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Calculadora sospechosamente funcional</h1>
    <p>Dos números entran. Un resultado sale. Normalmente.</p>

    <form id="calculator-form">
      <div class="grid">
        <input id="a" name="a" type="number" step="any" value="2" aria-label="Primer número" required>
        <select id="operation" name="operation" aria-label="Operación">
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="*">×</option>
          <option value="/">÷</option>
          <option value="**">potencia</option>
          <option value="%">módulo</option>
        </select>
        <input id="b" name="b" type="number" step="any" value="3" aria-label="Segundo número" required>
      </div>

      <button type="submit">Calcular sin hacer preguntas</button>
    </form>

    <section class="result" aria-live="polite">
      <span>Resultado</span>
      <strong id="result">5</strong>
    </section>
  </main>

  <script>
    const form = document.getElementById('calculator-form');
    const resultNode = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      resultNode.classList.remove('error');
      resultNode.textContent = 'Calculando...';

      const payload = {
        a: Number(document.getElementById('a').value),
        b: Number(document.getElementById('b').value),
        operation: document.getElementById('operation').value,
      };

      try {
        const response = await fetch('/api/calculate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Error desconocido. Los números se han rebelado.');
        }

        resultNode.textContent = String(data.result);
      } catch (error) {
        resultNode.classList.add('error');
        resultNode.textContent = error.message;
      }
    });
  </script>
</body>
</html>
